# ============================================================
#  Novi — keyboard shortcuts
# ============================================================
#
#  Every line is  <action> = <binding>.  Anything this file does not
#  mention keeps the shortcut Novi ships with, so changing one key
#  means writing one line — not copying the whole list out and keeping
#  it in step forever.
#
#  Deliberately NOT part of /etc/novi/system.conf. That file is the
#  declared state of the machine, converged by `novi-state apply`;
#  nothing converges a keyboard shortcut. novi-shell reads this once
#  when it starts, which is also when a change takes effect: log out
#  and back in, or Alt+Escape and start the desktop again.
#
#  `novi-launcher --keys` (Super + /) shows what is in force, reading
#  this same file — so the sheet always lists the key that will
#  actually fire, and it says so at the top if a line here could not
#  be understood.
#
#  ── Writing a binding ───────────────────────────────────────
#
#    Super+Return      Super, Win and Cmd all mean the same key
#    Alt+Shift+T       modifiers in any order
#    Meta+Space        Meta means Alt
#    Super+.           punctuation as the character, not its name
#    Print             a key with no modifier at all
#    off               this shortcut does nothing
#
#  Case does not matter: `Super+Q` and `super+q` are one binding,
#  because the compositor compares lowercased and so a difference here
#  would describe something that cannot happen.
#
#  Two shortcuts cannot share a binding. If a line moves one onto
#  another's key, the one further down this list is left UNBOUND and
#  the sheet says so — better than silently never firing.
#
#  Control is not a modifier Novi binds: a line naming Ctrl is
#  refused rather than half-applied.
#
#  ── If this file locks you out ──────────────────────────────
#
#  Add  novi.keys=off  to the kernel command line in the bootloader
#  (press `e` on the GRUB entry) and Novi ignores this file for that
#  boot, exactly as novi.state=off skips boot convergence. The sheet
#  ignores it too, so what you see is what you have.
#
#  ── Windows ─────────────────────────────────────────────────
#
# window.cycle-next   = Alt+Tab
# window.cycle-prev   = Alt+Shift+Tab
# window.terminal     = Super+Return
# window.close        = Super+Q
#
#  ── Workspaces ──────────────────────────────────────────────
#
#  These two answer to nine keys each, so only their modifiers can
#  move: write the binding with a digit and Novi reads the rest.
#
# workspace.switch    = Super+1
# workspace.move      = Super+Shift+1
#
#  ── Finding things ──────────────────────────────────────────
#
# find.launcher       = Alt+Space
# find.symbols        = Super+.
# find.shortcuts      = Super+/
# find.themes         = Super+T
# find.notifications  = Super+N
# find.screenshot     = Print
#
#  ── Sound ───────────────────────────────────────────────────
#
#  The media keys above the number row. These three keep working while
#  the screen is locked — changing the volume discloses nothing, and
#  being unable to silence a machine you have just locked is worse.
#
# sound.up            = VolumeUp
# sound.down          = VolumeDown
# sound.mute          = Mute
#
#  ── Session ─────────────────────────────────────────────────
#
# session.lock        = Super+L
# session.stay-awake  = Super+A
# session.power-menu  = Super+Escape
# session.quit        = Alt+Escape
