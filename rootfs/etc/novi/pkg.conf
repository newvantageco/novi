# ============================================================
#  Novi — package sources
# ============================================================
#
#  Where this machine gets software from. Deliberately NOT part of
#  /etc/novi/system.conf: that file is the declared state of the
#  machine, and this is a bootstrap parameter -- novi-state cannot
#  install a package from a mirror it would have to read out of the
#  file it is in the middle of applying.
#
#    pkg sync      refresh the index from the mirror
#    pkg search    what is available
#    pkg install   fetch, verify and install
#    pkg update    upgrade what is installed
#
#  `sync` and `update` are different operations with different names on
#  purpose.
# ============================================================

# ── Mirror ──────────────────────────────────────────────────
#
#  A URL, or a local directory. The installation media carries the
#  whole signed repository, so a live system can install the desktop
#  with no network at all -- which is also how `novi-install --profile
#  desktop` puts one on a machine that has never been online.
#
#  The same verification runs either way; only the transport differs.
mirror = /run/live/novi-repo

#  On an installed machine that path does not exist, and novi-install
#  comments this line out unless you passed it a --mirror. There is no
#  public Novi repository yet, and pointing a package manager at a host
#  that does not exist is worse than pointing it at nothing. Build your
#  own with `build/20-repo.sh`, serve the directory over HTTP, and put
#  its URL here:
#
# mirror = https://packages.example.org/novi/x86_64

# ── Trust ───────────────────────────────────────────────────
#
#  The repository index is signed, and `pkg sync` verifies it with
#  novi-verify (Ed25519) before believing a single line of it. Every
#  package's SHA-256 comes out of that index, so one signature
#  authenticates the whole repository -- and `pkg install` re-checks
#  the hash of every archive it is about to unpack, cached ones
#  included.
#
#  This key must reach the machine by some path other than the mirror
#  it is used to check. `build/20-repo.sh` installs a development key
#  into the image at build time, which is the right answer when you
#  built both.
key = /etc/novi/keys/novi-repo.pub

#  Setting this to `yes` turns off signature checking entirely. It
#  exists for bootstrapping a repository you are in the middle of
#  creating. On a machine you care about it means "run whatever the
#  network hands me, as root".
allow_unsigned = no

#  The index also carries a `valid-until`, inside the signed blob. A
#  signature says "this is genuine"; it does not say "this is current",
#  and without an expiry someone who can serve you an old but validly
#  signed index -- a hostile mirror, a captive portal, a stale cache --
#  can hold this machine at a version with a known hole indefinitely,
#  with every signature and every hash still checking out.
#
#  `pkg sync` refuses a stale index. `pkg update` only warns about one,
#  because a machine that has been offline for a month should explain
#  why it has nothing to offer rather than stop working.
#
#  If this machine has no battery-backed clock, fix the clock rather
#  than setting this: a wrong clock breaks the check in both
#  directions.
allow_stale = no
