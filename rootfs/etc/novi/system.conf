# ============================================================
#  Novi — declared system state
# ============================================================
#
#  This file IS your system's configuration. Not a cache of it, not a
#  hint to it -- the single declared truth.
#
#  Edit it here by hand, or change the same settings in Settings.
#  Both write this file. There is no second, hidden copy anywhere.
#
#    novi-state diff     see where the running system has drifted
#    novi-state apply    make the running system match this file
#    novi-state history  every state this machine has been applied to
#    novi-state rollback undo the last apply
#
#  Comments and layout in this file are yours -- Settings edits values
#  in place and leaves everything else exactly as you wrote it.
# ============================================================

# ── Identity ────────────────────────────────────────────────
hostname = novi

# ── This engine's own behaviour ─────────────────────────────
#
#  With this on, the machine BOOTS INTO the state declared below --
#  convergence runs once at every boot, not just when you ask for it.
#
#  If a declared state ever leaves you locked out (every getty off,
#  say), add `novi.state=off` to the kernel command line in the
#  bootloader to skip this entirely and get a normal boot back.
state.apply_on_boot = on

# ── Services ────────────────────────────────────────────────
#
#  on | off. Each maps to an s6-rc service (`s6-rc -a list` shows
#  what is actually up right now; `novi-state diff` compares that
#  against what this file says it should be).

# System logging: syslogd owns /dev/log and /var/log/messages;
# klogd feeds the kernel ring buffer into it.
services.syslog = on
services.klog = on

# Login consoles.
# The health watch (RFC 0014's signal, finally consumed). Samples
# `novi-state health` every 30s, publishes the verdict to
# /run/novi/health for the panel to read, and says something on the
# transition -- not every thirty seconds, which is how a notification
# stops being read.
services.health = on
services.getty-tty1 = on
services.getty-ttyS0 = on

# The desktop. Turn both on and `novi-state apply` to boot into the
# graphical session instead of a bare console -- seatd first, it is
# novi-shell's own declared dependency.
services.seatd = off
services.novi-shell = off

# sshd, from the openssh-server package (RFC 0022). Off, and inert
# until that package is installed -- s6-rc does not check that a run
# script's binary exists, so a declared-off service pointing at a
# program that is not there is not broken, just idle.
#
# Turning it on is not enough on its own: the firewall's default-drop
# input needs `network.firewall.allow = 22` as well, deliberately.
# See /usr/share/doc/openssh-server/README.
services.sshd = off

# novi-agentd (RFC 0032): a unix socket at /run/novi/agent/sock that
# lets a NON-ROOT process drive the agent verb list.
#
# `novi-agent do` needs root because the tools under it do, which means
# the program driving this machine has to be root -- and that program
# is the largest and least reviewable thing on it. This moves where the
# privilege lives: the big untrusted program runs as nobody in
# particular, a small reviewed one holds root. It does not widen or
# narrow what an agent may do; agent.allow still decides that.
#
# THE SOCKET IS THE BOUNDARY. /run/novi/agent is 0750 root:agent, so
# membership of the `agent` group is the grant -- unix's own mechanism
# rather than a fourth policy key. Adding somebody to that group is
# giving them everything agent.allow permits.
#
# Off by default, and separate from agent.enabled on purpose: running
# the interface and exposing it to non-root callers are two decisions.
services.novi-agentd = off

# ── Network ─────────────────────────────────────────────────
#
#  DHCP on one interface. There is deliberately no
#  `services.network` key: the network domain owns that service, and
#  two keys governing one thing is the split-brain this whole file
#  exists to prevent.
network.dhcp = on

#  auto = the first real (non-loopback) interface, which is the right
#  answer on any single-NIC machine. Name one explicitly to override.
network.interface = auto

#  auto = use whatever the DHCP lease offers. A comma-separated list
#  of servers overrides it:  novi-state set network.dns 1.1.1.1,9.9.9.9
network.dns = auto

#  WiFi. Off by default: most machines that boot this have no radio,
#  and a supplicant waiting forever for an interface that will never
#  exist is noise.
#
#  The passphrases are deliberately NOT here. This file is
#  world-readable and meant to be committed to git; credentials live in
#  /etc/novi/wifi.conf at 0600, managed with `novi-wifi`:
#
#    novi-wifi add <ssid>          add a network (prompts, never echoes)
#    novi-state set network.wifi on && novi-state apply
#
#  Configuration is declared; secrets are not.
network.wifi = off

#  auto = the first interface the kernel gave a phy80211 link.
network.wifi.interface = auto

#  The packet filter (RFC 0016). `on` loads /etc/novi/firewall.nft:
#  input defaults to drop, replies to connections this machine started
#  are accepted, loopback and ICMP are accepted, and nothing is
#  forwarded. Outbound is not filtered.
#
#  On by default, which is a deliberate departure from "new features
#  ship off". A firewall that has to be discovered and enabled is a
#  firewall nobody has -- the same criticism this project made of a
#  kernel built with nf_tables and no way to configure it. Nothing in
#  the base image listens on a port, so turning it on costs nothing
#  here and starts costing something exactly when you install
#  something that does listen, which is when you want to have been
#  asked.
network.firewall = on

#  The holes (RFC 0022). A comma-separated list of ports the input
#  chain accepts -- numbers, each optionally suffixed /tcp (the
#  default) or /udp. `none` is no holes at all, which is where a
#  machine starts.
#
#  This is a separate key from `services.<name>` on purpose. Enabling
#  a daemon does not open a port: that something listens and that the
#  world may reach it are two decisions, and a firewall that opens
#  itself because a service started is not one. `novi-state apply`
#  tells you when you have made the first decision and not the second.
#
#      network.firewall.allow = 22            # ssh
#      network.firewall.allow = 22, 80, 443
#
#  Anything more specific than a port -- a source address, a rate
#  limit, a different chain -- belongs in /etc/novi/firewall.nft,
#  which is a real file in nftables' real format and stays yours.
network.firewall.allow = none

# ── Users ───────────────────────────────────────────────────
#
#  Accounts. `users.<name>.shell` is the anchor: declaring one creates
#  the account, and `absent` removes it (the home directory is left
#  alone -- removing an account is a configuration change; deleting
#  someone's files is not).
#
#  Passwords are deliberately NOT here. This file is world-readable and
#  meant to be committed to git; a password hash belongs in neither.
#  Secrets keep their own 0600 store (/etc/shadow) and their own tools:
#  `passwd <name>`, or Settings' Account panel. An account created by
#  convergence starts locked until someone with root sets its password.
#
#  A desktop user wants video and input at minimum; wheel is Novi's
#  admin group (`su` to root).
#
#    users.alice.shell  = /bin/sh
#    users.alice.groups = audio,input,seat,users,video,wheel
#
#  `novi-install --user alice` writes exactly those two lines for you,
#  and creates the account while installing so the machine is usable on
#  its first boot rather than after a root login.

# ── Packages ────────────────────────────────────────────────
#
#  What software is installed, in the same document as everything
#  else -- same diff, same generations, same rollback.
#
#    packages.foot = present
#    packages.novi-screenshot = absent
#
#  Where they come from is /etc/novi/pkg.conf, deliberately not here:
#  a mirror is a bootstrap parameter, and this engine cannot fetch a
#  package from a setting it is in the middle of applying.
#
#  Nothing is declared by default. The desktop is currently part of the
#  base image AND available as packages, so declaring it here would
#  make a fresh machine report drift about software it already has.

# ── Storage ─────────────────────────────────────────────────
#
#  Removable media (RFC 0023). `on` means a USB stick, an SD card or an
#  external drive is mounted under /run/media/<label> the moment it is
#  plugged in, and unmounted when it goes away. `novi-eject <label>`
#  flushes and powers one down; `novi-mount list` says what is mounted.
#
#  On by default, and the argument is the firewall's in reverse: this
#  is what every other desktop does, and a machine where plugging in a
#  stick does nothing at all reads as broken rather than as careful.
#  What makes it defensible is the same thing that makes the firewall
#  defensible -- it is one line in a file you own, and turning it off
#  takes effect on the next device rather than the next reboot.
#
#  Volumes are always mounted nosuid,nodev: a setuid binary or a device
#  node on someone else's stick has no business being honoured. Only
#  filesystems this system explicitly knows are mounted at all.
storage.automount = on

# ── Display ─────────────────────────────────────────────────
#
#  Which renderer the compositor uses. `pixman` is software 2D,
#  `gles2` is OpenGL ES through Mesa, `auto` lets wlroots decide.
#
#  The default is not a guess. wlroots' own auto-detection picks
#  gles2 whenever the graphics device offers a render node, on the
#  assumption that a render node means hardware acceleration -- and in
#  a plain VM it does not: what answers there is softpipe, Mesa's
#  software rasteriser. Measured on a booted machine under identical
#  load, novi-shell's own CPU time over 20 seconds:
#
#      pixman             363 ticks
#      gles2 (softpipe)  1998 ticks     -- 5.5x more
#
#  Software rasterisation through a GL API is strictly more work than
#  drawing 2D directly, so auto-detection gets this backwards on every
#  machine without a real driver.
#
#  ON REAL HARDWARE THE ANSWER INVERTS, and by a much larger factor.
#  This project has never run on physical hardware, so the default is
#  the one that was measured rather than the one that is usually
#  right; if this machine has a working GPU driver, say so:
#
#      novi-state set display.renderer gles2
#
#  Read when the compositor starts, so it takes effect on the next
#  start of the desktop rather than immediately.

display.renderer = pixman

#  Which colour palette the desktop draws with (RFC 0030). A file in
#  /usr/share/novi/themes, named without the extension:
#
#    axiom      the design language's own palette, and the default
#    nocturne   near-black with an indigo accent
#    ember      warm, amber on a browner ground
#    paper      light
#
#  Not set by default, and that is not the same as "no theme": the
#  `axiom` palette is COMPILED INTO every client as the fallback, so an
#  undeclared key and `display.theme = axiom` draw the same desktop.
#  Leaving it undeclared means a console-only machine -- which has no
#  themes installed, because they ship with the desktop -- does not
#  report permanent drift against a file it was never going to have.
#
#  Clients read the published name when they START. Setting this and
#  applying it changes new windows; the ones already open keep the old
#  palette until they reopen. `apply` says so.
#
#    display.theme = nocturne

# ── Power ───────────────────────────────────────────────────
#
#  How this machine trades battery life against speed. Declared, so it
#  survives a reboot and shows up in a diff instead of living in
#  someone's half-remembered shell history.
#
#    novi-power governors      what this kernel offers
#    novi-power status         battery, AC, frequency, temperature
#    novi-power suspend        sleep
#
#  Not set by default: most machines that boot this are VMs with no
#  cpufreq driver at all, where any value would be permanent drift.
#
#    power.governor = schedutil
#
#  Turn the display off after this many idle seconds; `off` never does.
#  Read by novi-shell when the idle period elapses, so a change takes
#  effect at the next period rather than needing the session restarted.
#  A screen that never blanks is the panel and the battery.
#
#  Set by default, unlike power.governor above: blanking needs nothing
#  from the hardware beyond a connector the compositor already owns, so
#  there is no machine where declaring it is permanent drift.
#
#  What the lid and the power button do. Both are read at the moment
#  the event happens, so a change takes effect immediately -- there is
#  nothing to apply, and nothing that can be out of date. Values are
#  `suspend`, `poweroff` or `ignore`.
#
#  A laptop being used as a small server is the reason `ignore` is
#  there: close the lid, keep serving.

power.blank = 600
power.lid = suspend
power.button = poweroff

# ── Automated actors ────────────────────────────────────────
#
#  `novi-agent` is the interface a program uses to this machine
#  (RFC 0029). READING is always available and needs nothing here:
#
#    novi-agent describe        what this machine is, as one JSON
#                               document -- identity, hardware,
#                               network, declared state, drift,
#                               service health, packages
#    novi-agent capabilities    what it is allowed to change
#    novi-agent audit           what has been attempted, including
#                               what was refused
#
#  WRITING is not. `novi-agent do <verb>` runs only when
#  `agent.enabled` is on AND the verb is named in `agent.allow`.
#
#  Two keys rather than one, and that is the design. Deriving the
#  permissions from "the agent is installed" would be a machine that
#  grants powers because a program exists on it -- the same argument
#  RFC 0022 makes for `network.firewall.allow` being separate from
#  `services.sshd`. The set of things an automated actor may do has to
#  be one list a person chose.
#
#  Off by default, and that is not a hedge: an interface that can
#  install packages and converge system state should be switched on by
#  somebody who meant to.
#
#  The verbs are: state.set, state.apply, state.rollback, pkg.sync,
#  pkg.install, wifi.join. There is deliberately no `exec` and no
#  `service.start` -- see RFC 0029.
#
#    agent.allow = state.set, state.apply, pkg.sync, pkg.install
#
#  `wifi.join <ssid>` reads the passphrase from STDIN. It is never an
#  argument (/proc/<pid>/cmdline is world-readable) and it is never
#  written to the audit log -- the SSID is, because an SSID is
#  configuration and a passphrase is not.
#
#  Both keys are read at the moment `novi-agent do` runs, so a change
#  takes effect immediately and there is nothing to apply. Which also
#  means nothing rejects a typo at apply time, so an unusable value
#  reports as drift instead -- `agent.allow = pkg.instal` is a policy
#  that looks like it permits something and permits nothing.
#
#  `agent.rate` caps how many verbs may SUCCEED in a rolling minute.
#  Unset, 0, `off` and `none` all mean no limit, which is the default.
#
#    agent.rate = 20
#
#  IT IS NOT A SECURITY CONTROL. Anything that can run `novi-agent do`
#  can run `pkg` or `novi-state` directly. What it bounds is an
#  accident -- an actor looping on the same install -- and mostly what
#  it buys is that the loop becomes VISIBLE: a run of `rate limit`
#  refusals in the audit log says what happened, where a thousand
#  successful installs say nothing.

agent.enabled = off
