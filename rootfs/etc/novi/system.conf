# ============================================================
#  Novi — declared system state
# ============================================================
#
#  This file IS your system's configuration. Not a cache of it, not a
#  hint to it -- the single declared truth.
#
#  Edit it here by hand, or change the same settings in Settings.
#  Both write this file. There is no second, hidden copy anywhere.
#
#    novi-state diff     see where the running system has drifted
#    novi-state apply    make the running system match this file
#    novi-state history  every state this machine has been applied to
#    novi-state rollback undo the last apply
#
#  Comments and layout in this file are yours -- Settings edits values
#  in place and leaves everything else exactly as you wrote it.
# ============================================================

# ── Identity ────────────────────────────────────────────────
hostname = novi

# ── This engine's own behaviour ─────────────────────────────
#
#  With this on, the machine BOOTS INTO the state declared below --
#  convergence runs once at every boot, not just when you ask for it.
#
#  If a declared state ever leaves you locked out (every getty off,
#  say), add `novi.state=off` to the kernel command line in the
#  bootloader to skip this entirely and get a normal boot back.
state.apply_on_boot = on

# ── Services ────────────────────────────────────────────────
#
#  on | off. Each maps to an s6-rc service (`s6-rc -a list` shows
#  what is actually up right now; `novi-state diff` compares that
#  against what this file says it should be).

# System logging: syslogd owns /dev/log and /var/log/messages;
# klogd feeds the kernel ring buffer into it.
services.syslog = on
services.klog = on

# Login consoles.
services.getty-tty1 = on
services.getty-ttyS0 = on

# The desktop. Turn both on and `novi-state apply` to boot into the
# graphical session instead of a bare console -- seatd first, it is
# novi-shell's own declared dependency.
services.seatd = off
services.novi-shell = off

# ── Network ─────────────────────────────────────────────────
#
#  DHCP on one interface. There is deliberately no
#  `services.network` key: the network domain owns that service, and
#  two keys governing one thing is the split-brain this whole file
#  exists to prevent.
network.dhcp = on

#  auto = the first real (non-loopback) interface, which is the right
#  answer on any single-NIC machine. Name one explicitly to override.
network.interface = auto

#  auto = use whatever the DHCP lease offers. A comma-separated list
#  of servers overrides it:  novi-state set network.dns 1.1.1.1,9.9.9.9
network.dns = auto

#  WiFi. Off by default: most machines that boot this have no radio,
#  and a supplicant waiting forever for an interface that will never
#  exist is noise.
#
#  The passphrases are deliberately NOT here. This file is
#  world-readable and meant to be committed to git; credentials live in
#  /etc/novi/wifi.conf at 0600, managed with `novi-wifi`:
#
#    novi-wifi add <ssid>          add a network (prompts, never echoes)
#    novi-state set network.wifi on && novi-state apply
#
#  Configuration is declared; secrets are not.
network.wifi = off

#  auto = the first interface the kernel gave a phy80211 link.
network.wifi.interface = auto

# ── Users ───────────────────────────────────────────────────
#
#  Accounts. `users.<name>.shell` is the anchor: declaring one creates
#  the account, and `absent` removes it (the home directory is left
#  alone -- removing an account is a configuration change; deleting
#  someone's files is not).
#
#  Passwords are deliberately NOT here. This file is world-readable and
#  meant to be committed to git; a password hash belongs in neither.
#  Secrets keep their own 0600 store (/etc/shadow) and their own tools:
#  `passwd <name>`, or Settings' Account panel. An account created by
#  convergence starts locked until someone with root sets its password.
#
#  A desktop user wants video and input at minimum; wheel is Novi's
#  admin group (`su` to root).
#
#    users.alice.shell  = /bin/sh
#    users.alice.groups = audio,input,seat,users,video,wheel
#
#  `novi-install --user alice` writes exactly those two lines for you,
#  and creates the account while installing so the machine is usable on
#  its first boot rather than after a root login.

# ── Packages ────────────────────────────────────────────────
#
#  What software is installed, in the same document as everything
#  else -- same diff, same generations, same rollback.
#
#    packages.foot = present
#    packages.novi-screenshot = absent
#
#  Where they come from is /etc/novi/pkg.conf, deliberately not here:
#  a mirror is a bootstrap parameter, and this engine cannot fetch a
#  package from a setting it is in the middle of applying.
#
#  Nothing is declared by default. The desktop is currently part of the
#  base image AND available as packages, so declaring it here would
#  make a fresh machine report drift about software it already has.

# ── Power ───────────────────────────────────────────────────
#
#  How this machine trades battery life against speed. Declared, so it
#  survives a reboot and shows up in a diff instead of living in
#  someone's half-remembered shell history.
#
#    novi-power governors      what this kernel offers
#    novi-power status         battery, AC, frequency, temperature
#    novi-power suspend        sleep
#
#  Not set by default: most machines that boot this are VMs with no
#  cpufreq driver at all, where any value would be permanent drift.
#
#    power.governor = schedutil
