name: Lint

# Every branch: a lint that cannot run is worse than no lint, and this
# one is cheap.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # shellcheck is preinstalled on ubuntu-latest. Installing it
      # explicitly costs a second and means this job does not silently
      # change behaviour if that ever stops being true.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Exactly the command a contributor runs locally. This replaces a
      # third-party action that was pinned to a commit SHA which does
      # not exist, so every run for 124 consecutive attempts failed at
      # "unable to resolve action" without checking a single script.
      # A first-party tool we can read is also one less thing in the
      # supply chain, which is the same argument RFC 0006 makes about
      # the package trust root.
      - name: Run scripts/lint.sh
        run: bash scripts/lint.sh
