name: Security

# Weekly, and on every pull request.
on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays, 04:00 UTC
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This workflow previously ran Trivy, Semgrep and Gitleaks, all three
# through actions pinned to commit SHAs that do not exist -- so all
# three failed at "unable to resolve action" on every run and scanned
# nothing, while presenting as a security gate.
#
# What replaces them is smaller and true. This repository is shell, C
# and build scripts with no dependency manifests, so a dependency CVE
# scanner has nothing to read. What it *does* have is a hard rule that
# matters: no private key material in the tree. scripts/mkiso.sh
# already refuses to build an image if it finds any, and RFC 0006 makes
# the repository signing key the project's trust root. Checking the
# same thing here, in a job that actually runs, is worth more than
# three that do not.
jobs:
  secrets:
    name: No key material in the tree
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject committed private keys
        run: |
          set -uo pipefail
          fail=0

          # By filename. mkiso.sh refuses to build when it sees these
          # in the repository directory; the same rule, earlier.
          if find . -path ./.git -prune -o -type f \
                \( -name '*.key' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' \
                   -o -name 'id_rsa' -o -name 'id_ed25519' \) -print | grep .; then
            echo "::error::private key material committed to the repository"
            fail=1
          fi

          # By content, for anything that slipped past the name check.
          if grep -rIl --exclude-dir=.git -E '^-----BEGIN [A-Z ]*PRIVATE KEY-----' . | grep .; then
            echo "::error::a PEM private key block is present in the tree"
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "clean: no private key material found"
          exit "$fail"

      # The one pinned dependency in this project is its trust root, so
      # a silent change to it is the thing most worth noticing.
      - name: Verify the TweetNaCl hash pin is still declared
        run: |
          set -uo pipefail
          # Both TweetNaCl files must still go through fetch_pinned
          # with a 64-hex digest. Asserting the exact mechanism, not a
          # variable name that sounded plausible: a CI check built on a
          # guess about the code is the same failure as the actions
          # this workflow replaced.
          pins="$(grep -A2 'tweetnacl\.[ch]' build/01-fetch.sh | grep -cE '"[0-9a-f]{64}"')"
          if [ "${pins:-0}" -lt 2 ]; then
            echo "::error::build/01-fetch.sh no longer hash-pins both TweetNaCl files (RFC 0006 trust root)"
            grep -n -A2 'fetch_pinned' build/01-fetch.sh || true
            exit 1
          fi
          echo "trust root still hash-pinned (${pins} digests)"
