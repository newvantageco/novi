name: Security Scan

# Run weekly on Monday mornings and on every Pull Request
on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Concurrency group: cancel redundant runs for active PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-scan:
    name: Trivy Vulnerability & Misconfig Scan
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out repository code
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Step 2: Run Aqua Security Trivy filesystem scan
      - name: Run Trivy Vulnerability Scanner (FS mode)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: 'fs'
          ignore-unfixed: false
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      # Step 3: Upload Trivy SARIF results to GitHub Code Scanning Security tab
      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@6bb034416e7614dce01c9057de056092144fbc79 # v3.28.11
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  semgrep-scan:
    name: Semgrep Static Security Analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      # Step 1: Check out repository code
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Step 2: Run Semgrep scan on shell scripts and configuration files
      - name: Run Semgrep Rules
        run: |
          semgrep scan \
            --config "p/default" \
            --config "p/shell" \
            --config "p/secrets" \
            --sarif \
            --output semgrep-results.sarif || true

      # Step 3: Upload Semgrep SARIF report to GitHub Security tab
      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@6bb034416e7614dce01c9057de056092144fbc79 # v3.28.11
        if: always()
        with:
          sarif_file: 'semgrep-results.sarif'
          category: 'semgrep'

  gitleaks-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      # Step 1: Full git history checkout required for secret scanning across commits
      - name: Check out repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Step 2: Execute Gitleaks to detect accidentally committed tokens, API keys, or private keys
      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@f00e95db50faefeb9b8cf1424578b87455d31ca9 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SARIF: "true"
          GITLEAKS_NOTIFY_USER_ISSUE: "false"

      # Step 3: Upload Gitleaks SARIF report to GitHub Security tab
      - name: Upload Gitleaks SARIF report
        uses: github/codeql-action/upload-sarif@6bb034416e7614dce01c9057de056092144fbc79 # v3.28.11
        if: always()
        with:
          sarif_file: 'gitleaks.sarif'
          category: 'gitleaks'
